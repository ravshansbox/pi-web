name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Check package
        run: npm run check

      - name: Build artefacts
        run: npm run build && npm run build:bin

      - name: Verify npm package contents
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: true
        run: |
          npm pack --json --dry-run > pack.json
          node -e "const fs=require('node:fs');const pack=JSON.parse(fs.readFileSync('pack.json','utf8'))?.[0];const files=pack?.files?.map(f=>f.path)||[];if(!files.includes('bin/pi-web.js')){console.error('bin/pi-web.js is missing from the publish artefact');process.exit(1);}"

      - name: Publish
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: true
        run: npm publish
